<style>
/* Layout: mobiele app — compacte kop met persoonwissel, één kolom kaarten (max 720px), vaste tabbalk onderin, keuzelijsten als bottom sheet */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E3EBE8; --ink:#13201C; --muted:#56675F; --line:#D2DDD8;
  --accent:#0B6B5F; --accent-soft:#D3EAE5; --on-accent:#FFFFFF; --scrim:rgba(10,20,17,.45);
  --kracht:#0B6B5F; --cardio:#2C67A8; --voetbal:#3B7F2E; --rust:#7F8C87; --prep:#B47A0A; --sport:#7A4FA0;
  --good:#2E7D45; --warn:#B47A0A; --bad:#B23E2C;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --surface2:#1E2A26; --ink:#E4EDEA; --muted:#98ABA4; --line:#2A3833;
  --accent:#40B5A4; --accent-soft:#173A35; --on-accent:#08201C; --scrim:rgba(0,0,0,.6);
  --kracht:#40B5A4; --cardio:#6FA3E2; --voetbal:#79BE69; --rust:#7D8B86; --prep:#E3AE45; --sport:#B48BDA;
  --good:#6CC07E; --warn:#E3AE45; --bad:#E57A66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --surface2:#1E2A26; --ink:#E4EDEA; --muted:#98ABA4; --line:#2A3833;
  --accent:#40B5A4; --accent-soft:#173A35; --on-accent:#08201C; --scrim:rgba(0,0,0,.6);
  --kracht:#40B5A4; --cardio:#6FA3E2; --voetbal:#79BE69; --rust:#7D8B86; --prep:#E3AE45; --sport:#B48BDA;
  --good:#6CC07E; --warn:#E3AE45; --bad:#E57A66; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
body.sheet-open{overflow:hidden}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);min-height:38px;padding:0 14px;border-radius:999px;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
main{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:transparent;color:var(--muted);font:600 11.5px var(--f-body);height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.bottom svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom button[aria-current="page"] svg{stroke-width:2.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.card h3{font-size:15.5px;font-weight:700;margin:16px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.between>div{min-width:0}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--rust));display:inline-block}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.t-rust{--c:var(--rust)} .t-krachtA,.t-krachtB{--c:var(--kracht)} .t-cardio{--c:var(--cardio)} .t-voetbal{--c:var(--voetbal)} .t-voorbereiding{--c:var(--prep)} .t-sport{--c:var(--sport)}
.weeknav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.weeknav strong{font-family:var(--f-display);font-size:16px;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;flex:0 0 auto}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 0 6px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;position:relative;overflow:hidden;min-height:58px}
.day::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:4px;background:var(--c,var(--rust))}
.day b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.day span{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);min-height:44px;padding:0 16px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.ghost{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
:is(.btn,.day,.iconbtn,nav.bottom button,.seg button,.chip,.opt,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;min-height:44px}
input[type=number]{width:84px}
textarea{width:100%;min-height:80px}
input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--accent)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fgrid input,.fgrid select{width:100%}
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tgt{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center}
.tgt b{display:block;font-size:18px;font-family:var(--f-display);line-height:1.2}
.tgt span{font-size:11.5px;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:var(--accent)}
.bar.over>div{background:var(--warn)}
.meal{border-top:1px solid var(--line);padding:12px 0}
.meal:first-child{border-top:0;padding-top:4px}
.meal .mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.meal .mh .t{min-width:0}
.meal .lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.meal .name{font-weight:700;font-size:16px;line-height:1.3}
.meal ul{margin:6px 0 0;padding-left:18px}
.meal li{font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.ex b.n{font-size:16px}
.ex select{width:100%}
.setrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:8px;align-items:center}
.setrow.one{grid-template-columns:42px 1fr}
.setrow .lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface2);color:var(--ink);font:700 20px var(--f-body);cursor:pointer;min-height:44px}
.stepper input{border:0;border-radius:0;text-align:center;width:100%;padding:6px 2px;min-height:44px;font-variant-numeric:tabular-nums}
.stepper .u{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);padding:2px 0;border-top:1px solid var(--line)}
.tip{font-size:13.5px;color:var(--muted)}
.prog{font-size:13.5px;font-weight:600;color:var(--good)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.shop label{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.shop label .n{flex:1;min-width:0}
.shop label .q{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.shop label.done .n{text-decoration:line-through;color:var(--muted)}
.cat{margin:16px 0 2px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.dcard{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.dcard:first-child{border-top:0}
.dcard .dname{font-weight:700;font-size:16.5px;line-height:1.3}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--good)}
.status.err{color:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.tpl-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:6px;align-items:center;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.routine{counter-reset:r;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.routine li{display:flex;gap:10px;align-items:baseline}
.routine li::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:700;color:var(--accent);min-width:16px}
.tiles{display:grid;gap:10px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer;min-height:64px}
.tile b{display:block;font-size:16px}
.tile span{font-size:13.5px;color:var(--muted)}
.kennis p{max-width:66ch}
/* bottom sheet */
#sheet{position:fixed;inset:0;z-index:30}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);max-width:720px;margin:0 auto}
#sheet .head{padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:grid;gap:10px}
#sheet .grip{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
#sheet .list{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);min-height:36px;padding:0 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:12px 2px;cursor:pointer}
.opt[aria-selected="true"]{background:var(--accent-soft);border-radius:10px;padding-inline:10px}
.opt b{display:block;font-size:15.5px;line-height:1.3}
.opt .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.opt .meta .k{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:4px 0;cursor:pointer;min-height:44px}
.rbtn b{font-size:15.5px}.rbtn span{grid-column:1;font-size:13.5px;color:var(--muted)}.rbtn em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:13px;font-weight:700;color:var(--accent)}
.routine li::before{align-self:center}
.anim{background:var(--surface2);border-radius:14px;overflow:hidden;aspect-ratio:1/1;max-width:100%;max-height:46vh;margin:10px auto 12px;display:grid;place-items:center}
.anim video{width:100%;height:100%;object-fit:contain;display:block;background:var(--surface2)}
.anim-ph{display:grid;justify-items:center;gap:6px;color:var(--muted);font-size:14px}
.anim-ph svg{width:40px;height:40px;fill:var(--line)}
.steps{margin:0 0 12px;padding-left:20px;display:grid;gap:6px;font-size:15px}
.applybar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:380px){.targets{grid-template-columns:repeat(2,minmax(0,1fr))}.day span{font-size:13.5px}}
@media (prefers-reduced-motion:no-preference){.bar>div{transition:width .3s ease}#sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img,video{max-width:100%}
[hidden]{display:none!important}
</style>

</head>

<header class="top">
  <div class="wrap toprow">
    <div class="brand">Gezinsplan<small id="savestate">Laden…</small></div>

<nav class="bottom" aria-label="Onderdelen"><div class="in" id="nav"></div></nav>

<script src="config.js"></script>
<script src="supabase.js"></script>

function mondayOf(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=t.getUTCFullYear();const f4=new Date(Date.UTC(fy,0,4));const w=1+Math.round(((t-f4)/864e5-3+((f4.getUTCDay()+6)%7))/7);return fy+'-W'+String(w).padStart(2,'0')}
const dShort=d=>d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});

function macros(items){let k=0,p=0,c=0,f=0;for(const [id,g] of items){const x=ING[id];if(!x)continue;const m=g/100;k+=x[1]*m;p+=x[2]*m;c+=x[3]*m;f+=x[4]*m}return{k,p,c,f}}
function bmr(p){return 10*p.gewicht+6.25*p.lengte-5*p.leeftijd+(p.geslacht==='v'?-161:5)}
function targets(p,type){const rest=Math.round((bmr(p)*p.pal-p.tekort)/10)*10;const kcal=rest+(BONUS[type]||0);const prot=Math.round(p.eiwitPerKg*p.gewicht/5)*5;const fat=Math.round(p.vetPerKg*p.gewicht);return{kcal,prot,fat,carb:Math.max(0,Math.round((kcal-prot*4-fat*9)/4))}}
function roundG(id,g){const x=ING[id];if(x&&x[7]&&COUNT.includes(id))return Math.max(1,Math.round(g/x[7]))*x[7];return Math.max(5,Math.round(g/5)*5)}
function scaleF(p){return Math.min(1.3,Math.max(0.6,targets(p,'rust').kcal/2250))}
function poolItems(pool,id,p,tplKey){const o=pool[id];if(!o||!o.i)return p[tplKey];const f=scaleF(p);return o.i.map(([i,g])=>[i,roundG(i,g*f)])}
function dinnerItems(dish,e,k){return dish.i.map(([id,g,r])=>[id,Math.round(g*(r==='e'?e:r==='k'?k:1))])}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hashStr(t){let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;return h}
function genMenu(rand){
 const ids=Object.keys(DISH);const used=new Set();
 const pick=(tag,pref)=>{let c=ids.filter(id=>DISH[id].t.includes(tag)&&!used.has(id));if(pref){const c2=c.filter(id=>DISH[id].t.includes(pref));if(c2.length)c=c2}if(!c.length)c=ids.filter(id=>!used.has(id));const x=c[Math.floor(rand()*c.length)];used.add(x);return x};
 const m={};m.za=pick('pasta');
 const order=['kip','kip','vis','vega','vega','vlees'];for(let i=order.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 const rest=['ma','di','wo','do','vr','zo'];
 rest.forEach((dk,i)=>{const busy=['p1','p2'].some(pid=>/kracht/.test((S.set.personen[pid].schema||{})[dk]));m[dk]=pick(order[i],busy?'snel':null)});
 return m;
}

function dayPlan(pid,date){
 const p=S.set.personen[pid];const wk=isoWeek(date);const dk=dkOf(date);const type=p.schema[dk]||'rust';const t=targets(p,type);
 const dishId=menuOf(wk).diner[dk];const dish=DISH[dishId]||DISH.d1;const snack=SNACK[type]||SNACK.rust;const kz=keuze(wk,pid,dk);
 const ontbijt=poolItems(ONTBIJT,kz.o,p,'ontbijt'),lunch=poolItems(LUNCH,kz.l,p,'lunch');
 const fixed=[...ontbijt,...lunch,...snack.i];const e=p.eMult||1;
 const carbK=Math.max(1,macros(dish.i.filter(x=>x[2]==='k').map(([id,g])=>[id,g])).k);
 let k=1,kw=0;
 for(let it=0;it<4;it++){
  const m=macros([...fixed,...dinnerItems(dish,e,k),['kwark',kw]]);const gap=t.prot-m.p;
  if(gap>8||gap<-15)kw=Math.min(500,Math.max(0,kw+Math.round(gap/0.09/50)*50));
  const m2=macros([...fixed,...dinnerItems(dish,e,1),['kwark',kw]]);
  k=Math.min(1.8,Math.max(0.5,Math.round((1+(t.kcal-m2.k)/carbK)*20)/20));
 }
 const din=dinnerItems(dish,e,k);
 const restGap=t.kcal-macros([...fixed,...din,['kwark',kw]]).k;
 const extra=restGap>120?Math.min(4,Math.round(restGap/175)):0;
 const meals=[
  {key:'ontbijt',lbl:'Ontbijt · 09:00–10:00',n:kz.o==='o0'?'Vast ontbijt':ONTBIJT[kz.o].n,i:ontbijt,pick:'ontbijt'},
  {key:'lunch',lbl:'Lunch',n:kz.l==='l0'?'Vaste lunch':LUNCH[kz.l].n,i:lunch,pick:'lunch'},
  {key:'snack',lbl:snack.n,n:'Tussendoortje',i:snack.i},
 ];
 if(extra>0)meals.push({key:'extra',lbl:'Aanvulling',n:`${extra} ${extra===1?'boterham':'boterhammen'} met pindakaas`,i:[['brood',35*extra],['pindakaas',15*extra]]});
 meals.push({key:'diner',lbl:'Gezinsdiner · ± 18:00',n:dish.n,i:din,mult:{e,k},pick:'diner'});
 if(kw>0)meals.push({key:'avond',lbl:(type==='krachtA'||type==='krachtB')?'Na de training · ± 20:45':'Avond',n:'Magere kwark',i:[['kwark',kw]]});
 return{p,type,t,meals,tot:macros(meals.flatMap(m=>m.i)),dish,dishId,wk,dk,kz};
}
function kidsDay(date){const wk=isoWeek(date);const dish=DISH[menuOf(wk).diner[dkOf(date)]]||DISH.d1;const n=S.set.kinderen||0;const f=S.set.kindFactor||0.5;const it=[];if(n>0){for(const [id,g] of dish.i)it.push([id,g*f*n]);if(S.set.kindBasis)for(const [id,g] of KIND_BASIS)it.push([id,g*n])}return it}
function shoppingFor(dates){const tot={};const add=(id,g)=>{tot[id]=(tot[id]||0)+g};for(const d of dates){for(const pid of ['p1','p2'])dayPlan(pid,d).meals.forEach(m=>m.i.forEach(([id,g])=>add(id,g)));kidsDay(d).forEach(([id,g])=>add(id,g))}return tot}
function qtyLabel(id,g){const x=ING[id];const unit=x[8]||'g';const st=x[7];
 if(st){const n=Math.max(1,Math.ceil(g/st-0.15));

const CFG=window.GEZINSPLAN_CONFIG||{};
const CONFIGURED=!!(CFG.supabaseUrl&&CFG.supabaseKey&&!/JOUW|xxxx/i.test(CFG.supabaseUrl+CFG.supabaseKey)&&window.supabase);
const LS_KEY='gezinsplan-v2',LS_PENDING='gezinsplan-pending';
function lsLoad(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);if(o.set)S.set=mergeSettings(o.set);S.menus=o.menus||{};S.logs=o.logs||{};S.checkins=o.checkins||{}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({set:S.set,menus:S.menus,logs:S.logs,checkins:S.checkins}))}catch(e){}}
function pendingGet(){try{return JSON.parse(localStorage.getItem(LS_PENDING)||'{}')}catch(e){return{}}}
function pendingSet(p){try{localStorage.setItem(LS_PENDING,JSON.stringify(p))}catch(e){}}
function mergeSettings(o){const r=Object.assign(clone(DEFAULT_SETTINGS),o||{});r.personen=Object.assign(clone(DEFAULT_SETTINGS.personen),(o&&o.personen)||{});for(const k of ['p1','p2'])r.personen[k]=Object.assign(clone(DEFAULT_SETTINGS.personen[k]),r.personen[k]);return r}
function applyDoc(path,data){
 if(path==='gezin/instellingen'){S.set=mergeSettings(data);return}
 const [col,id]=path.split('/');if(!id)return;
 if(col==='menu')S.menus[id]=data;else if(col==='training')S.logs[id]=data;else if(col==='checkin')S.checkins[id]=data;
}
const queues={},timers={};
function writeDoc(path,data){
 lsSave();
 if(S.mode!=='db'){setSave('ok',CONFIGURED?'Niet ingelogd · op dit apparaat':'Opgeslagen op dit apparaat');return Promise.resolve()}
 const pend=pendingGet();pend[path]=data;pendingSet(pend);
 S.saving++;setSave('busy','Opslaan…');
 const p=(queues[path]||Promise.resolve()).then(()=>S.sb.from('docs').upsert({path,data,updated_at:new Date().toISOString(),updated_by:S.email||null})).then(({error})=>{
  S.saving--;if(error)throw error;const pd=pendingGet();if(pd[path]===undefined||JSON.stringify(pd[path])===JSON.stringify(data)){delete pd[path];pendingSet(pd)}
  if(!S.saving)setSave('ok','Opgeslagen · gedeeld met het gezin')}).catch(e=>{S.saving=Math.max(0,S.saving);setSave('err',navigator.onLine?'Opslaan mislukt; ik probeer het later opnieuw':'Offline · wordt opgeslagen zodra je weer online bent')});
 queues[path]=p;return p;
}
async function flushPending(){if(S.mode!=='db')return;const pend=pendingGet();for(const [path,data] of Object.entries(pend))await writeDoc(path,data)}
function debounce(key,fn,ms=700){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
function saveSettings(){debounce('set',()=>writeDoc('gezin/instellingen',clone(S.set)))}
function setMenu(wk,mut){const m=menuOf(wk);mut(m);S.menus[wk]=m;debounce('menu'+wk,()=>writeDoc('menu/'+wk,clone(S.menus[wk])),400)}
function saveCheckin(id){debounce('ci'+id,()=>writeDoc('checkin/'+id,clone(S.checkins[id])),800)}
function setSave(cls,txt){const el=document.getElementById('savestate');if(el){el.textContent=txt;el.className=cls==='err'?'status err':cls==='ok'?'status ok':'status'}}
async function loadRemote(){
 const {data,error}=await S.sb.from('docs').select('path,data');
 if(error){setSave('err',error.code==='42501'||/permission|policy/i.test(error.message)?'Dit account staat niet op de gezinslijst':'Laden mislukt; je ziet de laatst bewaarde versie');return}
 const pend=pendingGet();
 S.menus={};S.logs={};S.checkins={};
 for(const r of data)applyDoc(r.path,r.data);
 for(const [p,d] of Object.entries(pend))applyDoc(p,d);
 lsSave();setSave('ok','Gedeeld met het gezin');render();flushPending();
}
async function connect(){
 lsLoad();
 if(!CONFIGURED){S.mode='local';render();setSave('ok','Testmodus · opslag op dit apparaat');return}
 S.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
 const {data:{session}}=await S.sb.auth.getSession();
 S.sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='SIGNED_OUT'){S.mode='login';S.email=null;render()}});
 if(!session){S.mode='login';render();return}
 startSession(session);
}
function startSession(session){
 S.mode='db';S.email=session.user.email;
 const me=(CFG.leden||[]).find(l=>l.email&&l.email.toLowerCase()===S.email.toLowerCase());if(me&&me.persoon)S.ui.person=me.persoon;
 render();setSave('busy','Laden…');loadRemote();
 if(S.channel)S.sb.removeChannel(S.channel);
 S.channel=S.sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{const r=pl.new;if(!r||!r.path)return;if(pendingGet()[r.path]!==undefined)return;applyDoc(r.path,r.data);lsSave();render()}).subscribe();

function sessionFor(pid,date){if(S.ui.sessie)return S.ui.sessie;return S.set.personen[pid].schema[dkOf(date)]==='krachtB'?'B':'A'}
function logId(pid,date,s){return `${pid}_${ymd(date)}_${s}`}
function lastLogFor(pid,exId,before,v){const arr=Object.values(S.logs).filter(l=>l.persoon===pid&&l.datum<before&&l.ex&&l.ex[exId]&&(l.ex[exId].v||0)===v).sort((a,b)=>a.datum<b.datum?1:-1);return arr[0]?{datum:arr[0].datum,d:arr[0].ex[exId],enkel:arr[0].enkel}:null}
function getDraft(pid,date,s){
 const id=logId(pid,date,s);if(S.draft[id])return S.draft[id];
 const saved=S.logs[id];const p=S.set.personen[pid];const d={ex:{},enkel:'',notitie:''};
 for(const ex of SESSIONS[s].ex){
  if(saved&&saved.ex&&saved.ex[ex.id]){d.ex[ex.id]=clone(saved.ex[ex.id]);continue}
  const v=p.varianten[ex.id]||0;const last=lastLogFor(pid,ex.id,ymd(date),v);
  d.ex[ex.id]={v,sets:Array.from({length:ex.sets},(_,i)=>({kg:last&&last.d.sets[i]?last.d.sets[i].kg:(ex.v[v].t==='kb'?20:''),reps:''}))}}
 if(saved){d.enkel=saved.enkel??'';d.notitie=saved.notitie||''}
 S.draft[id]=d;return d;
}

function vTraining(){

 const exHtml=ses.ex.map(ex=>{const st=d.ex[ex.id];const v=st.v||0;const vt=ex.v[v];const last=lastLogFor(pid,ex.id,ymd(date),v);const noKg=vt.t==='trx'||vt.t==='bw';
  let prog='';if(last){const top=last.d.sets.every(x=>Number(x.reps)>=ex.max);prog=`<div class="tip">Vorige keer: ${esc(last.d.sets.map(x=>(!noKg&&x.kg!==''&&x.kg!=null?x.kg+' kg × ':'')+(x.reps||'–')).join(' · '))}</div>`+(top?`<div class="prog">${INC[vt.t]}</div>`:'');
   if(p.enkel&&last.enkel!==''&&Number(last.enkel)>3)prog+=`<div class="tip" style="color:var(--warn)">Enkel scoorde vorige keer ${esc(last.enkel)}/10: houd de belasting gelijk of kies de rustigere variant.</div>`}
  return `<div class="ex"><div class="between"><div><b class="n">${esc(vt.n)}</b><div class="small muted num">${ex.sets} × ${ex.min===ex.max?ex.min:ex.min+'–'+ex.max} · rust ${ex.rust}</div></div><button class="btn small ghost" data-act="uitleg" data-v="${vt.s}">Uitleg</button></div>

/* ----- voortgang ----- */
const ciId=(pid,wk)=>pid+'_'+wk;
function getCi(pid,wk){return S.checkins[ciId(pid,wk)]||{persoon:pid,week:wk,gewicht:{},taille:'',energie:'',slaap:'',enkel:'',check:[false,false,false,false,false],notitie:''}}
function avgW(ci){const v=Object.values(ci.gewicht||{}).map(Number).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
const CHECKS=['Gemiddeld ongeveer mijn eiwitdoel gehaald','Twee krachttrainingen gedaan of bewust aangepast','Genoeg gegeten voor voetbal en training','Gewicht / middelomtrek over meerdere weken de goede kant op','Energie, slaap en enkelreactie in de gaten gehouden'];
function vVoortgang(){
 const pid=S.ui.person;const p=S.set.personen[pid];const wk=curWeek();const ci=getCi(pid,wk);const mon=curMonday();const a=avgW(ci);
 const hist=Object.values(S.checkins).filter(c=>c.persoon===pid).map(c=>({wk:c.week,w:avgW(c),t:Number(c.taille)||null,e:c.energie,s:c.slaap})).filter(x=>x.w||x.t).sort((x,y)=>x.wk<y.wk?-1:1).slice(-12);
 let advies='Vul minstens 3 weken in; daarna geeft de app hier een bijstuuradvies.';
 const ws=hist.filter(h=>h.w);if(ws.length>=3){const l=ws.slice(-3);const per=(l[2].w-l[0].w)/2;const ts=hist.filter(h=>h.t);const tDown=ts.length>=2&&ts[ts.length-1].t<ts[0].t;
  if(per<-0.5)advies=`Je verliest ${fmt(-per,1)} kg per week: dat is snel. Voeg 100–200 kcal per dag toe (lager tekort in Profielen).`;
  else if(per>-0.1&&!tDown)advies='Gewicht en middelomtrek bewegen niet. Volg je het plan redelijk? Verlaag dan met 100–150 kcal per dag (hoger tekort in Profielen) of beweeg dagelijks wat meer. Eén ding tegelijk.';
  else advies=`Op koers (${fmt(per,2)} kg per week${tDown?', middelomtrek daalt':''}). Niets veranderen.`}
 const sel=(f,v)=>`<select id="ci-${f}" data-act="ci" data-f="${f}" style="width:100%">${['','1','2','3','4','5'].map(x=>`<option value="${x}" ${String(v)===x?'selected':''}>${x||'–'}</option>`).join('')}</select>`;
 return `${backBtn()}<section class="card">${weekNav()}</section>
 <section class="card"><div class="eyebrow">${esc(p.naam)}</div><h2>Wekelijkse check-in</h2><p class="sub">Weeg 3–7 ochtenden, na het toilet en voor het ontbijt.</p>
  <div class="fgrid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr))">${DAYS.map((d,i)=>`<label class="f" for="w-${d}">${d} ${addDays(mon,i).getDate()}<input type="number" step="0.1" inputmode="decimal" id="w-${d}" data-act="ci" data-f="gewicht" data-d="${d}" value="${esc(ci.gewicht[d]||'')}" placeholder="kg"></label>`).join('')}</div>
  <p class="num" style="margin:12px 0">Weekgemiddelde: <b>${a?fmt(a,1)+' kg':'–'}</b></p>
  <div class="fgrid">
   <label class="f" for="ci-taille">Middelomtrek (cm)<input type="number" step="0.5" inputmode="decimal" id="ci-taille" data-act="ci" data-f="taille" value="${esc(ci.taille)}"></label>
   <label class="f" for="ci-energie">Energie (1–5)${sel('energie',ci.energie)}</label>
   <label class="f" for="ci-slaap">Slaap (1–5)${sel('slaap',ci.slaap)}</label>
   ${p.enkel?`<label class="f" for="ci-enkel">Enkel ochtend erna (0–10)<input type="number" inputmode="numeric" min="0" max="10" id="ci-enkel" data-act="ci" data-f="enkel" value="${esc(ci.enkel)}"></label>`:''}
  </div>
  <h3>Checklist</h3>${CHECKS.map((c,i)=>`<label class="check" for="cc-${i}"><input type="checkbox" id="cc-${i}" data-act="cicheck" data-i="${i}" ${ci.check&&ci.check[i]?'checked':''}><span>${c}</span></label>`).join('')}
  <label class="f" for="ci-notitie" style="margin-top:8px">Notitie<textarea id="ci-notitie" data-act="ci" data-f="notitie">${esc(ci.notitie)}</textarea></label>
 </section>
 <section class="card"><h2>Trend en bijsturen</h2><div class="note" style="margin:8px 0 12px">${esc(advies)}</div>${chart(hist)}
  ${hist.length?`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Week</th><th class="n">Gewicht</th><th class="n">Middel</th><th class="n">E</th><th class="n">S</th></tr></thead><tbody>${hist.slice().reverse().map(h=>`<tr><td>w${h.wk.split('-W')[1]}</td><td class="n">${h.w?fmt(h.w,1):'–'}</td><td class="n">${h.t?fmt(h.t,1):'–'}</td><td class="n">${esc(h.e||'–')}</td><td class="n">${esc(h.s||'–')}</td></tr>`).join('')}</tbody></table></div>`:''}
 </section>`;
}
function chart(hist){const pts=hist.filter(h=>h.w);if(pts.length<2)return '<p class="sub">De grafiek verschijnt zodra er twee weken met gewicht zijn ingevuld.</p>';
 const W=360,H=180,L=34,R=12,T=16,B=26;const ys=pts.map(p=>p.w);let lo=Math.floor(Math.min(...ys)-0.5),hi=Math.ceil(Math.max(...ys)+0.5);if(hi-lo<2){hi+=1;lo-=1}
 const x=i=>L+i*(W-L-R)/(pts.length-1);const y=v=>T+(hi-v)*(H-T-B)/(hi-lo);const step=hi-lo>6?2:1;const ticks=[];for(let v=lo;v<=hi;v+=step)ticks.push(v);
 const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
 return `<div class="chart" role="img" aria-label="Weekgemiddelde gewicht"><svg viewBox="0 0 ${W} ${H}">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
  <path d="${path} L${x(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===pts.length-1?4.5:2.5}" fill="var(--accent)"/>${pts.length<=8||i%2===pts.length%2?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">w${p.wk.split('W')[1]}</text>`:''}`).join('')}
  <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].w)-9}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${fmt(pts[pts.length-1].w,1)} kg</text></svg></div>`}

/* ----- profielen ----- */
function vProfielen(){
 const pid=S.ui.person;const p=S.set.personen[pid];
 const num=(f,l,step=1)=>`<label class="f" for="${pid}-${f}">${l}<input type="number" step="${step}" inputmode="decimal" id="${pid}-${f}" data-act="prof" data-p="${pid}" data-f="${f}" value="${esc(p[f])}"></label>`;
 const tpl=(key,label)=>`<h3>${label}</h3>${p[key].map(([id,g],i)=>`<div class="tpl-row"><select id="${pid}-${key}-${i}-id" data-act="tpl" data-p="${pid}" data-k="${key}" data-i="${i}" data-f="id" aria-label="Ingrediënt">${Object.entries(ING).sort((a,b)=>a[1][0].localeCompare(b[1][0])).map(([k,x])=>`<option value="${k}" ${k===id?'selected':''}>${esc(x[0])}</option>`).join('')}</select><input type="number" inputmode="numeric" id="${pid}-${key}-${i}-g" data-act="tpl" data-p="${pid}" data-k="${key}" data-i="${i}" data-f="g" value="${g}" aria-label="Gram"><button class="iconbtn" data-act="tplDel" data-p="${pid}" data-k="${key}" data-i="${i}" aria-label="Verwijder">×</button></div>`).join('')}<button class="btn small" data-act="tplAdd" data-p="${pid}" data-k="${key}">+ Ingrediënt</button><p class="tip">${(()=>{const m=macros(p[key]);return `${fmt(m.k)} kcal · ${fmt(m.p)} g eiwit · ${fmt(m.c)} g koolh. · ${fmt(m.f)} g vet`})()}</p>`;
 const avg=Math.round(DAYS.reduce((a,d)=>a+targets(p,p.schema[d]).kcal,0)/7);
 return `${backBtn()}
 <section class="card"><div class="between"><div><div class="eyebrow">Profiel</div><h2>${esc(p.naam)}</h2></div>${p.voorbeeld?'<span class="pill">Voorbeeld</span>':''}</div>
  <p class="sub">Wissel bovenin van persoon om het andere profiel te bewerken. Rustverbranding ${fmt(bmr(p))} kcal × ${fmt(p.pal,2)} − ${p.tekort} kcal tekort; weekgemiddelde ${fmt(avg)} kcal.</p>
  <div class="fgrid">
   <label class="f" for="${pid}-naam">Naam<input id="${pid}-naam" data-act="prof" data-p="${pid}" data-f="naam" value="${esc(p.naam)}"></label>
   <label class="f" for="${pid}-geslacht">Geslacht<select id="${pid}-geslacht" data-act="prof" data-p="${pid}" data-f="geslacht"><option value="m" ${p.geslacht==='m'?'selected':''}>Man</option><option value="v" ${p.geslacht==='v'?'selected':''}>Vrouw</option></select></label>
   ${num('leeftijd','Leeftijd')}${num('lengte','Lengte (cm)')}${num('gewicht','Gewicht (kg)',0.1)}${num('pal','Activiteitsfactor',0.05)}${num('tekort','Tekort (kcal)',25)}${num('eiwitPerKg','Eiwit (g/kg)',0.1)}${num('vetPerKg','Vet (g/kg)',0.1)}${num('eMult','Eiwitportie diner (×)',0.05)}
  </div>
  <label class="check" for="${pid}-enkel"><input type="checkbox" id="${pid}-enkel" data-act="profchk" data-p="${pid}" data-f="enkel" ${p.enkel?'checked':''}><span>Enkel volgen in training en check-in</span></label>
 </section>
 <section class="card"><h2>Weekschema en doelen</h2>
  <div class="tablewrap"><table><thead><tr><th>Dag</th><th>Type</th><th class="n">kcal</th><th class="n">Eiwit</th></tr></thead><tbody>${DAYS.map(d=>{const ty=p.schema[d];const t=targets(p,ty);return `<tr><td>${d}</td><td><select id="${pid}-sch-${d}" data-act="schema" data-p="${pid}" data-d="${d}" aria-label="Dagtype ${DAYN[d]}" style="width:100%;min-width:140px">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${k===ty?'selected':''}>${l}</option>`).join('')}</select></td><td class="n">${fmt(t.kcal)}</td><td class="n">${t.prot}</td></tr>`}).join('')}</tbody></table></div>
 </section>
 <section class="card"><h2>Vaste maaltijden</h2><p class="sub">Gebruikt als je bij Vandaag niets anders kiest.</p>${tpl('ontbijt','Ontbijt')}${tpl('lunch','Lunch')}</section>
 <section class="card"><h2>Gezin</h2><p class="sub">Kinderen eten mee met het diner; de lijst rekent ook een basis ontbijt en lunch voor ze mee.</p>
  <div class="fgrid">
   <label class="f" for="g-kinderen">Aantal kinderen<input type="number" inputmode="numeric" min="0" id="g-kinderen" data-act="gezin" data-f="kinderen" value="${S.set.kinderen}"></label>
   <label class="f" for="g-factor">Kinderportie (×)<input type="number" step="0.05" inputmode="decimal" min="0" id="g-factor" data-act="gezin" data-f="kindFactor" value="${S.set.kindFactor}"></label>
  </div>
  <label class="check" for="g-basis"><input type="checkbox" id="g-basis" data-act="gezinchk" data-f="kindBasis" ${S.set.kindBasis?'checked':''}><span>Ontbijt en lunch kinderen meenemen</span></label>
  <p class="tip">${S.mode==='db'?'Alles wordt gedeeld opgeslagen in de gezinsdatabase.':'Testmodus: wijzigingen blijven op dit toestel.'}</p>
 </section>`;
}
function vKennis(){return `${backBtn()}<section class="card kennis"><h2>De kern</h2><p>Eet gemiddeld rond je dagdoel met genoeg eiwit, train twee keer per week progressief maar enkelvriendelijk, houd cardio en voetbal aan, doe de korte ochtendroutine en stuur na 3–4 weken bij op basis van trends en herstel.</p></section>
 <section class="card kennis"><h2>Energie en macro's</h2><p>Doelen zijn startschattingen: rustverbranding (Mifflin-St Jeor) × activiteitsfactor, min een bescheiden tekort voor 0,2–0,4 kg per week. Krachtdagen +150 kcal, de dag voor voetbal +200, voetbal +400, vooral als koolhydraten.</p><p>Eiwit circa 1,9 g/kg voor Dion, binnen de 1,4–2,0 g/kg uit het ISSN-standpunt. Vet circa 0,9 g/kg. Koolhydraten vullen de rest. Mis je eiwit, dan vult de app aan met magere kwark in de avond.</p></section>
 <section class="card kennis"><h2>Training</h2><p>Houd 2–3 herhalingen over. Haal je in alle sets de bovenkant van de range met goede techniek, dan een kleine stap zwaarder; anders eerst herhalingen erbij. Verhoog nooit gewicht, sets en frequentie tegelijk.</p><p>Enkel: geen sprongen of explosieve draaibewegingen nodig. Let ook op de reactie later die dag en de volgende ochtend. Bij scherpe pijn, zwelling of instabiliteit: stop de oefening en vraag advies.</p></section>
 <section class="card kennis"><h2>Voetbal</h2><p>Koolhydraten vooraf helpen; gels of sportdrank zijn geen verplichting. Licht ontbijt rond 07:00, water voor vertrek, na afloop een normale maaltijd. Koolhydraten tijdens de wedstrijd (30–60 g per uur) alleen bij hoge intensiteit of warmte, en eerst testen.</p></section>
 <section class="card kennis"><h2>Slaap en herstel</h2><p>22:30–06:00 is een redelijke basis. Probeer twee weken geen cafeïne na de lunch, maak het laatste halfuur rustig en eindig de training met een cooling-down. Blijf je langdurig moe, snurk je veel of vermoed je ademstops: bespreek het met de huisarts.</p></section>
 <section class="card kennis"><h2>Bronnen</h2><ul><li>Jäger e.a., ISSN Position Stand: protein and exercise (2017)</li><li>ACSM position stand over krachttraining (2026)</li><li>IOC sportvoedingsmateriaal (Athlete365)</li><li>Mifflin e.a. (1990), formule rustverbranding</li></ul><p class="tip">Dit plan vervangt geen medisch of fysiotherapeutisch advies.</p></section>`}

/* ================= INTERACTIE ================= */
function curDraft(){const pid=S.ui.person;const date=addDays(curMonday(),S.ui.day);const s=sessionFor(pid,date);return{pid,date,s,d:getDraft(pid,date,s)}}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='person'){S.ui.person=b.dataset.v;S.ui.sessie=null;render()}
 else if(a==='tab'){S.ui.tab=b.dataset.v;S.ui.sessie=null;render();window.scrollTo(0,0)}
 else if(a==='week'){S.ui.week+=Number(b.dataset.v);S.ui.sessie=null;render()}
 else if(a==='day'){S.ui.day=Number(b.dataset.v);S.ui.sessie=null;render()}
 else if(a==='sessie'){S.ui.sessie=b.dataset.v;render()}
 else if(a==='shopSel'){S.ui.shop=b.dataset.v;render()}
 else if(a==='openPick')openPick(b.dataset.kind,b.dataset.dk);
 else if(a==='uitleg'){S.ui.sheet={kind:'uitleg',v:b.dataset.v};document.body.classList.add('sheet-open');renderSheet()}
 else if(a==='logout'){S.sb&&S.sb.auth.signOut()}
 else if(a==='closeSheet')closeSheet();
 else if(a==='pickTag'){S.ui.sheet.tag=b.dataset.v;renderSheet()}
 else if(a==='pickDo')pickDo(b.dataset.v);
 else if(a==='newMenu'){const wk=curWeek();setMenu(wk,m=>{m.diner=genMenu(seeded(Date.now()))});render()}
 else if(a==='step'){const {d}=curDraft();const set=d.ex[b.dataset.ex].sets[Number(b.dataset.i)];const f=b.dataset.f;const st=Number(b.dataset.s)||1;if(set[f]===''&&Number(b.dataset.d)<0)return;const cur=Number(set[f])||0;let nv=Math.max(0,Math.round((cur+st*Number(b.dataset.d))*10)/10);
  if(cur===0&&f==='reps'&&Number(b.dataset.d)>0){const ex=SESSIONS[curDraft().s].ex.find(x=>x.id===b.dataset.ex);nv=ex.min}
  set[f]=nv;const inp=document.getElementById((f==='kg'?'kg-':'rp-')+b.dataset.ex+'-'+b.dataset.i);if(inp)inp.value=nv}
 else if(a==='copy'){const ta=document.getElementById('copy-'+b.dataset.list);const done=()=>{b.textContent='Gekopieerd';setTimeout(()=>{b.textContent='Kopieer lijst'},1600)};
  try{navigator.clipboard.writeText(ta.value).then(done,()=>{fallbackCopy(ta);done()})}catch(err){fallbackCopy(ta);done()}}
 else if(a==='saveTraining'){const {pid,date,s,d}=curDraft();const id=b.dataset.id;
  const doc={persoon:pid,datum:ymd(date),sessie:s,ex:clone(d.ex),enkel:d.enkel===''?'':Number(d.enkel),notitie:d.notitie,ts:Date.now()};
  S.logs[id]=doc;writeDoc('training/'+id,doc);render();b.blur()}
 else if(a==='tplAdd'){S.set.personen[b.dataset.p][b.dataset.k].push(['banaan',120]);saveSettings();render()}
 else if(a==='tplDel'){S.set.personen[b.dataset.p][b.dataset.k].splice(Number(b.dataset.i),1);saveSettings();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ui.sheet)closeSheet()});
document.addEventListener('submit',e=>{if(e.target.id==='loginform'){e.preventDefault();login(document.getElementById('li-email').value,document.getElementById('li-pw').value)}});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function fallbackCopy(ta){try{ta.style.left='0';ta.select();document.execCommand('copy');ta.style.left='-9999px'}catch(e){}}
function onField(e,chg){const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;
 if(a==='set'){const {d}=curDraft();d.ex[el.dataset.ex].sets[Number(el.dataset.i)][el.dataset.f]=el.value===''?'':Number(el.value);return}
 if(a==='draft'){curDraft().d[el.dataset.f]=el.value;return}
 if(a==='pickQ'){S.ui.sheet.q=el.value;renderSheet();const q=document.getElementById('pickq');if(q){q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(x){}}return}
 if(a==='pickAll'&&chg){S.ui.sheet.all=el.checked;return}
 if(a==='variant'&&chg){const {pid,date,s,d}=curDraft();const v=Number(el.value);const ex=d.ex[el.dataset.ex];ex.v=v;const def=SESSIONS[s].ex.find(x=>x.id===el.dataset.ex);const last=lastLogFor(pid,def.id,ymd(date),v);ex.sets=ex.sets.map((x,i)=>({kg:last&&last.d.sets[i]?last.d.sets[i].kg:(def.v[v].t==='kb'?20:''),reps:x.reps}));S.set.personen[pid].varianten[def.id]=v;saveSettings();render();return}
 if(a==='tick'&&chg){const wk=curWeek();setMenu(wk,m=>{m.afgevinkt[el.dataset.list]=Object.assign({},m.afgevinkt[el.dataset.list],{[el.dataset.id]:el.checked})});render();return}
 if(a==='extra'){const wk=curWeek();setMenu(wk,m=>{m.extra[el.dataset.list]=el.value});return}
 if(a==='ci'){const pid=S.ui.person;const wk=curWeek();const id=ciId(pid,wk);const ci=clone(getCi(pid,wk));if(el.dataset.f==='gewicht')ci.gewicht[el.dataset.d]=el.value===''?'':Number(el.value);else ci[el.dataset.f]=el.value;S.checkins[id]=ci;saveCheckin(id);debounce('rr',render,900);return}
 if(a==='cicheck'&&chg){const pid=S.ui.person;const wk=curWeek();const id=ciId(pid,wk);const ci=clone(getCi(pid,wk));ci.check=ci.check||[];ci.check[Number(el.dataset.i)]=el.checked;S.checkins[id]=ci;saveCheckin(id);return}
 if(a==='prof'){const p=S.set.personen[el.dataset.p];const f=el.dataset.f;if(f==='naam'||f==='geslacht')p[f]=el.value;else{const n=Number(el.value);if(el.value===''||isNaN(n))return;p[f]=n}p.voorbeeld=false;saveSettings();debounce('rr',render,chg?50:900);return}
 if(a==='profchk'&&chg){S.set.personen[el.dataset.p][el.dataset.f]=el.checked;saveSettings();render();return}
 if(a==='schema'&&chg){const p=S.set.personen[el.dataset.p];p.schema[el.dataset.d]=el.value;p.voorbeeld=false;saveSettings();render();return}
 if(a==='tpl'){const row=S.set.personen[el.dataset.p][el.dataset.k][Number(el.dataset.i)];if(el.dataset.f==='id')row[0]=el.value;else{const n=Number(el.value);if(isNaN(n))return;row[1]=n}saveSettings();debounce('rr',render,chg?50:900);return}
 if(a==='gezin'){const n=Number(el.value);if(el.value===''||isNaN(n))return;S.set[el.dataset.f]=n;saveSettings();debounce('rr',render,600);return}
 if(a==='gezinchk'&&chg){S.set[el.dataset.f]=el.checked;saveSettings();render();return}
}
document.body.addEventListener('input',e=>onField(e,false));
document.body.addEventListener('change',e=>onField(e,true));
connect();
</script>
